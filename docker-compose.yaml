services:
  qatarina:
    build: .
    #image: golang-malawi/qatarina
    volumes:
      - "./:/opt/"
    ports:
      - "4597:4597"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qatarina_network
  db:
    image: postgres:18-alpine
    container_name: "qatarina-database"
    expose:
    - 5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qatarina}
      POSTGRES_USER: ${POSTGRES_USER:-qatarina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    # volumes:
      # - postgres_data:/var/lib/postgresql/data
    networks:
      - qatarina_network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB:-qatarina}", "-U", "${POSTGRES_USER:-qatarina}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional full-text search engine, only started with `docker compose --profile search up`.
  # Set search.provider to "meilisearch" and search.meilisearch.url to "http://meilisearch:7700"
  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: "qatarina-meilisearch"
    profiles: ["search"]
    expose:
    - 7700
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-to-a-16-byte-master-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - qatarina_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 
  meilisearch_data:

networks:
  qatarina_network:
