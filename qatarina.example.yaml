server:
  fqdn: "qatarina.example.com"
  host: "localhost"
  port: 4597
  base_url: "http://localhost:5173"

auth:
  signup_enabled: true
  require_verified_accounts: true
  max_login_attempts: 3
  jwt_secret_key: "secret-key"
  jwt_issuer: "qatarina.example.com"
  jwt_expiry_timeout: 36000

db:
  host: "localhost"
  port: 5432
  username: "qatarina"
  password: "qatarina123"
  database: "qatarina"
  options: "sslmode=disable&connect_timeout=30"
  conn_max_lifetime: 3600

admin:
  email: "administrator@nndi.cloud"
  username: "admin"
  password: "base64-encoded"
  enabled: true

logging:
  file: "/var/log/qatarina.log"
  level: "debug"

platform:
  create_default_test_plan: true

smtp:
  host: "localhost"
  port: 1025
  username: "<smtp-username>"
  password: "<smtp-password>"
  from: "no-reply@qatarina.local"
  reply_to: "support@qatarina.local"
  ssl: false

ai:
  gemini_api_key: "<your-gemini-api-key>"

gotenberg:
  libreoffice_url: "http://localhost:3000/forms/libreoffice/convert"

import_file:
  max_rows: 512

github:
  app_id: "<your-github-app-id>"
  app_slug: "<your-github-app-slug>"
  private_key_path: "./secrets/<your-github-app>.private-key.pem"
  webhook_secret: "<your-webhook-secret>"

storage:
  driver: "local"
  local_path: "./uploads"
  s3_bucket: "qatarina-attachments"
  s3_region: "af-south-1"

s3:
  bucket: "qatarina-attachments"
  region: "af-south-1"

attachments:
  max_file_size: 10485760 # 10 MB


